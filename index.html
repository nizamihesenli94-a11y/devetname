<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toy Dəvətnaməsi</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #7d6342;
            --accent-color: #c5a059;
            --bg-color: #faf8f5;
            --text-color: #4a4a4a;
            --card-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 10px;
        }

        .invitation-card {
            background-color: var(--card-bg);
            max-width: 500px;
            width: 100%;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(197, 160, 89, 0.2);
            padding: 40px 25px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .invitation-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 6px;
            background: linear-gradient(90deg, #c5a059, #e8d5b5, #c5a059);
        }

        .subtitle {
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: 0.85rem;
            color: var(--accent-color);
            margin-bottom: 15px;
            font-weight: 500;
        }

        /* Bəy və Gəlin adlarının ölçüsü böyüdüldü */
        .couple-names {
            font-family: 'Great Vibes', cursive;
            font-size: 3.8rem;
            color: var(--primary-color);
            line-height: 1.2;
            margin-bottom: 20px;
        }

        .invitation-text {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 1.05rem;
            margin-bottom: 30px;
            color: #666;
        }

        .section-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.25rem;
            color: var(--primary-color);
            margin: 25px 0 15px;
            position: relative;
            display: inline-block;
        }

        .section-title::after {
            content: '';
            display: block;
            width: 40px;
            height: 1px;
            background-color: var(--accent-color);
            margin: 5px auto 0;
        }

        /* Geyim Kodları (Dress Code) */
        .dress-code-container {
            display: flex;
            justify-content: space-around;
            gap: 15px;
            margin-bottom: 25px;
        }

        .dress-code-card {
            flex: 1;
            background: #fdfbf7;
            border: 1px solid rgba(197, 160, 89, 0.2);
            border-radius: 12px;
            padding: 15px 10px;
        }

        .dress-code-icon {
            font-size: 1.8rem;
            color: var(--accent-color);
            margin-bottom: 8px;
        }

        .dress-code-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            color: var(--primary-color);
            margin-bottom: 4px;
        }

        .dress-code-desc {
            font-size: 0.85rem;
            color: #555;
        }

        /* Form Elementləri */
        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 5px;
            color: var(--primary-color);
        }

        .form-group input, 
        .form-group select, 
        .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.95rem;
            background-color: #fafafa;
        }

        .form-group input:focus, 
        .form-group select:focus, 
        .form-group textarea:focus {
            outline: none;
            border-color: var(--accent-color);
            background-color: #fff;
        }

        /* WhatsApp Düyməsi */
        .btn-whatsapp {
            width: 100%;
            background-color: #25D366;
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 12px rgba(37, 211, 102, 0.25);
            margin-top: 20px;
        }

        .btn-whatsapp:hover {
            background-color: #1eb956;
        }
    </style>
</head>
<body>

    <div class="invitation-card">
        <div class="subtitle">Birlikdə Yeni Bir Başlanğıca</div>
        
        <h1 class="couple-names">Əli & Aysel</h1>
        
        <p class="invitation-text">
            Sizi bu xüsusi və xoş günümüzdə yanımızda görməkdən şad olarıq.
        </p>

        <!-- Dress Code -->
        <div class="section-title">Geyim Kodu (Dress Code)</div>
        <div class="dress-code-container">
            <div class="dress-code-card">
                <div class="dress-code-icon">
                    <i class="fa-solid fa-user-tie"></i>
                </div>
                <div class="dress-code-title">Kişilər Üçün</div>
                <div class="dress-code-desc">Kostyum & Smoking</div>
            </div>
            <div class="dress-code-card">
                <div class="dress-code-icon">
                    <i class="fa-solid fa-person-dress"></i>
                </div>
                <div class="dress-code-title">Qadınlar Üçün</div>
                <div class="dress-code-desc">Ziyafət Paltarı</div>
            </div>
        </div>

        <!-- Vahid Form -->
        <div class="section-title">İştirak və Təbrik</div>
        <form id="rsvpForm">
            <div class="form-group">
                <label for="fullName">Ad və Soyadınız</label>
                <input type="text" id="fullName" placeholder="Ad və soyadınızı daxil edin" required>
            </div>

            <div class="form-group">
                <label for="attendance">İştirak Durumunuz</label>
                <select id="attendance" required>
                    <option value="" disabled selected>Seçim edin</option>
                    <option value="Bəli, məmnuniyyətlə iştirak edəcəyəm">Bəli, iştirak edəcəyəm</option>
                    <option value="Təəssüf ki, iştirak edə bilməyəcəyəm">İştirak edə bilməyəcəyəm</option>
                </select>
            </div>

            <div class="form-group">
                <label for="guestCount">Qonaq Sayı</label>
                <select id="guestCount">
                    <option value="1 nəfər">1 nəfər</option>
                    <option value="2 nəfər">2 nəfər</option>
                    <option value="3+ nəfər">3 və ya daha çox nəfər</option>
                </select>
            </div>

            <div class="form-group">
                <label for="wishes">Arzu və Təbrikləriniz (Könüllü)</label>
                <textarea id="wishes" rows="3" placeholder="Ürək sözlərinizi buraya yaza bilərsiniz..."></textarea>
            </div>

            <button type="submit" class="btn-whatsapp">
                <i class="fa-brands fa-whatsapp"></i>
                Təsdiqlə və WhatsApp ilə Göndər
            </button>
        </form>
    </div>

    <script>
        document.getElementById('rsvpForm').addEventListener('submit', function(e) {
            e.preventDefault();

            // WhatsApp Nömrənizi buraya daxil edin (məs: 994501234567)
            const phoneNumber = "994500000000";

            const fullName = document.getElementById('fullName').value;
            const attendance = document.getElementById('attendance').value;
            const guestCount = document.getElementById('guestCount').value;
            const wishes = document.getElementById('wishes').value;

            let message = `Salam! Toy dəvətinə cavab və təbrik:%0A%0A`;
            message += `👤 *Ad Soyad:* ${encodeURIComponent(fullName)}%0A`;
            message += `📌 *İştirak:* ${encodeURIComponent(attendance)}%0A`;
            
            if (attendance.includes("Bəli")) {
                message += `👥 *Qonaq Sayı:* ${encodeURIComponent(guestCount)}%0A`;
            }

            if (wishes.trim() !== "") {
                message += `✍️ *Arzu və Təbrik:* ${encodeURIComponent(wishes)}%0A`;
            }

            const whatsappUrl = `https://wa.me/${phoneNumber}?text=${message}`;
            window.open(whatsappUrl, '_blank');
        });
    </script>
</body>
</html>
